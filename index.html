<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">

  <title>Frontend Mentor | Product preview card component</title>
 
  <!-- font styles (Montserrat - 500, 700; Fraunces - 700 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

</head>

<body>
  <main class="page">

    <article class="card" aria-label="Product preview card">

      <!-- figure  -->
      <figure class="card__image">
        <picture>
          <source media="(min-width: 768px)" srcset="./images/image-product-desktop.jpg">
          <img src="./images/image-product-mobile.jpg" alt="Bottle of Gabrielle Essence perfume">
        </picture>
      </figure>

      <!-- product descriptions -->
      <div class="card__content">
        <p class="card__product-type">PERFUME</p>
        <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>
        <p class="card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
        
        <!-- prices -->
        <div class="card__price-group">
          <span class="card__price-new">$149.99</span>
          <span class="card__price-old" aria-hidden="true"><del>$169.99</del></span>
        </div>

        <!-- button -->
        <button class="card__button" type="button">
          <img src="./images/icon-cart.svg" alt="" aria-hidden="true" class="card__button-icon">
          Add to Cart
        </button> 
      </div>

    </article>

  </main>
  <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by Yejoo Lim.
    </footer>


</body>
</html>
