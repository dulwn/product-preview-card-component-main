<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main class="page">

    <article class="card" aria-label="Product preview card">
      <figure class="card__image">
        <picture>
          <source media="(min-width: 768px)" srcset="./images/image-product-desktop.jpg">
          <img src="./images/image-product-mobile.jpg" alt="Bottle of Gabrielle Essence perfume">
        </picture>
      </figure>

      <div class="card__content">
        <p class="card__product-type">Perfume</p>
        <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>
        <p class="card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>

        <div class="card__price-group">
          <span class="card__price-new">$149.99</span>
          <span class="card__price-old" aria-hidden="true"><del>$169.99</del></span>
        </div>

        <button class="card__button" type="button">
          <img src="./images/icon-cart.svg" alt="" aria-hidden="true" class="card__button-icon">
          Add to Cart
        </button> 
      </div>
    </article>

  </main>
  <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by <a href="#">Your Name Here</a>.
    </footer>


</body>
</html>
